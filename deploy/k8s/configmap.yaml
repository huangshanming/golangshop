apiVersion: v1
kind: ConfigMap
metadata:
  name: goshop-config
  namespace: goshop
data:
  config.yaml: |
    server:
      mode: release
      port: 8080
    database:
      host: mysql
      port: 3306
      user: goshop
      password: goshop123
      dbname: goshop
      charset: utf8mb4
      max_idle: 10
      max_open: 100
    redis:
      addr: redis:6379
      password: ""
      db: 0
    rabbitmq:
      url: amqp://goshop:goshop123@rabbitmq:5672/
    jwt:
      app_secret: change-me-app-secret
      admin_secret: change-me-admin-secret
      app_expire_hours: 168
      admin_expire_hours: 24
