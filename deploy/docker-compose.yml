services:
  mysql:
    image: mysql:8.0
    container_name: goshop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: goshop
      MYSQL_USER: goshop
      MYSQL_PASSWORD: goshop123
    ports:
      - "3307:3306"
    volumes:
      - goshop_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: goshop-redis
    ports:
      - "6379:6379"
    volumes:
      - goshop_redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: goshop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: goshop
      RABBITMQ_DEFAULT_PASS: goshop123
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    container_name: goshop-minio
    environment:
      MINIO_ROOT_USER: goshop
      MINIO_ROOT_PASSWORD: goshop123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - goshop_minio_data:/data

  server:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    container_name: goshop-server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      GOSHOP_DATABASE_HOST: mysql
      GOSHOP_DATABASE_PORT: 3307
      GOSHOP_DATABASE_USER: goshop
      GOSHOP_DATABASE_PASSWORD: goshop123
      GOSHOP_DATABASE_DBNAME: goshop
      GOSHOP_REDIS_ADDR: redis:6379
      GOSHOP_RABBITMQ_URL: amqp://goshop:goshop123@rabbitmq:5672/
    ports:
      - "8888:8888"
    volumes:
      - ../config.yaml:/app/config.yaml:ro

volumes:
  goshop_mysql_data:
  goshop_redis_data:
  goshop_minio_data:
